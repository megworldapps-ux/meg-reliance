
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Enquiry</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

    <!-- ================================
         COURSE ENQUIRY FORM
    ================================= -->

    <section class="course-enquiry-section">

        <div class="course-form-container">

            <!-- Header -->
            <div class="course-form-header">

                <span class="course-form-tag">
                    COURSE ENQUIRY
                </span>

                <h2>
                    Get In Touch
                </h2>

                <p>
                    Fill in your details and our team will contact you shortly.
                </p>

            </div>


            <!-- Form -->
            <form
                id="courseForm"
                novalidate
            >

                <!-- First Name + Last Name -->

                <div class="course-form-row">

                    <div class="course-form-group">

                        <label for="firstName">
                            First Name
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="Enter first name"
                            autocomplete="given-name"
                            required
                        >

                    </div>


                    <div class="course-form-group">

                        <label for="lastName">
                            Last Name
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Enter last name"
                            autocomplete="family-name"
                            required
                        >

                    </div>

                </div>


                <!-- Email -->

                <div class="course-form-group">

                    <label for="email">
                        Email Address
                        <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="course-form-group">

                    <label for="phone">
                        Phone Number
                        <span>*</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10 digit phone number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- City -->

                <div class="course-form-group">

                    <label for="city">
                        City
                        <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter your city"
                        autocomplete="address-level2"
                        required
                    >

                </div>


                <!-- Course -->

                <div class="course-form-group">

                    <label for="course">
                        Select Course
                        <span>*</span>
                    </label>

                    <select
                        id="course"
                        name="course"
                        required
                    >

                        <option value="">
                            Select a course
                        </option>

                        <option value="MBA">
                            MBA
                        </option>

                        <option value="BBA">
                            BBA
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="MCA">
                            MCA
                        </option>

                        <option value="B.Com">
                            B.Com
                        </option>

                        <option value="M.Com">
                            M.Com
                        </option>

                        <option value="Logistics & Supply Chain Management">
                            Logistics & Supply Chain Management
                        </option>

                        <option value="Digital Marketing">
                            Digital Marketing
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Submit Button -->

                <button
                    type="submit"
                    class="course-submit-btn"
                    id="submitBtn"
                >

                    <span id="submitText">
                        Submit Enquiry
                    </span>

                    <span class="course-submit-arrow">
                        →
                    </span>

                </button>


                <!-- Success / Error Message -->

                <div
                    id="formMessage"
                    class="course-form-message"
                ></div>

            </form>

        </div>

    </section>


    <!-- Form JavaScript -->
    <script src="form.js"></script>

</body>

</html>
